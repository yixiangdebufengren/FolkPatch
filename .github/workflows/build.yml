name: Build FolkPatch

on:
  push:
    branches: [ main, develop ]
    paths: [ 'app/**', 'fpd/**', '.github/workflows/build.yml' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'app/**', 'fpd/**', '.github/workflows/build.yml' ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'both'
        type: choice
        options: [ both, debug, release ]

env:
  KEYSTORE_FILE: debug.keystore
  KEYSTORE_PASSWORD: android
  KEY_ALIAS: androiddebugkey
  KEY_PASSWORD: android

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_debug: ${{ steps.set.outputs.debug }}
      build_release: ${{ steps.set.outputs.release }}
      commit_msg: ${{ steps.msg.outputs.text }}
      commit_author: ${{ steps.msg.outputs.author }}
      artifact_list: ${{ steps.set.outputs.artifact_list }}

    steps:
      - id: set
        run: |
          TYPE="${{ inputs.build_type }}"
          [ "${{ github.event_name }}" != "workflow_dispatch" ] && TYPE="both"

          DEBUG="false"; RELEASE="false"; LIST=""
          [ "$TYPE" = "both" -o "$TYPE" = "debug" ] && { DEBUG="true"; LIST="folkpatch-debug-${{ github.sha }}"; }
          [ "$TYPE" = "both" -o "$TYPE" = "release" ] && {
            RELEASE="true"
            [ -n "$LIST" ] && LIST="$LIST," || true
            LIST="${LIST}folkpatch-release-${{ github.sha }}"
          }

          echo "debug=$DEBUG" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "artifact_list=$LIST" >> "$GITHUB_OUTPUT"

      - id: msg
        run: |
          case "${{ github.event_name }}" in
            push)         TEXT="${{ github.event.head_commit.message }}"
                           AUTHOR="${{ github.event.head_commit.author.name }}" ;;
            pull_request) TEXT="PR: ${{ github.event.pull_request.title }}"
                           AUTHOR="${{ github.event.pull_request.user.login }}" ;;
            *)            TEXT="FolkPatch Build"
                           AUTHOR="${{ github.actor }}" ;;
          esac
          TEXT="${TEXT%%$'\n'*}"
          echo "text=$TEXT" >> "$GITHUB_OUTPUT"
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"

  build_debug:
    name: Build Debug
    needs: prepare
    if: needs.prepare.outputs.build_debug == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-build-env

      - name: Customize app name
        env:
          CUSTOM_NAME: YiXiangRen
        run: |
          find app/src/main/res -name "strings.xml" | while read f; do
            sed -i 's|<string name="app_name"[ ]>[^<]*</string>|<string name="app_name">'"$CUSTOM_NAME"'</string>|' "$f"
            sed -i 's|<string name="app_name_fpatch"[ ]>[^<]*</string>|<string name="app_name_fpatch">'"$CUSTOM_NAME"'</string>|' "$f"
          done
          sed -i 's|android:label="FolkPatch"|android:label="'"$CUSTOM_NAME"'"|g' app/src/main/AndroidManifest.xml
          sed -i 's|prefs.getString("desktop_app_name", "FolkPatch")|prefs.getString("desktop_app_name", "'"$CUSTOM_NAME"'")|' app/src/main/java/me/bmax/apatch/util/LauncherIconUtils.kt
          echo "App name replaced"

      - run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          SHORT="${GITHUB_SHA::7}"
          APK=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
          [ -n "$APK" ] && mv "$APK" "FolkPatch-Debug-${SHORT}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: folkpatch-debug-${{ github.sha }}
          path: FolkPatch-Debug-*.apk
          retention-days: 30

  build_release:
    name: Build Release
    needs: prepare
    if: needs.prepare.outputs.build_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-build-env

      - name: Customize app name
        env:
          CUSTOM_NAME: YiXiangRen
        run: |
          find app/src/main/res -name "strings.xml" | while read f; do
            sed -i 's|<string name="app_name"[ ]>[^<]*</string>|<string name="app_name">'"$CUSTOM_NAME"'</string>|' "$f"
            sed -i 's|<string name="app_name_fpatch"[ ]>[^<]*</string>|<string name="app_name_fpatch">'"$CUSTOM_NAME"'</string>|' "$f"
          done
          sed -i 's|android:label="FolkPatch"|android:label="'"$CUSTOM_NAME"'"|g' app/src/main/AndroidManifest.xml
          sed -i 's|prefs.getString("desktop_app_name", "FolkPatch")|prefs.getString("desktop_app_name", "'"$CUSTOM_NAME"'")|' app/src/main/java/me/bmax/apatch/util/LauncherIconUtils.kt
          echo "App name replaced"

      - name: Customize custom icon
        run: |
          if [ -f custom-icon.png ]; then
            find app/src/main/res/mipmap-anydpi-v26 -name "*.png" -delete 2>/dev/null || true
            for dir in app/src/main/res/mipmap-*; do
              [ -d "$dir" ] || continue
              cp custom-icon.png "$dir/ic_launcher.png"
              cp custom-icon.png "$dir/ic_launcher_round.png"
            done
            echo "Custom icon applied"
          else
            echo "No custom-icon.png provided"
          fi

      - name: Bypass signature verification
        run: |
          FILE="app/src/main/java/me/bmax/apatch/APatchApp.kt"

          # Step 1: Replace the if condition line with a comment
          sed -i 's|if (!BuildConfig.DEBUG && !verifyAppSignature("qeultwLrVftfSxpnKnEzoWp7yuqUnN5DyBLvJsd96BI=")) {|// SIGNATURE VERIFICATION BYPASSED - for custom build|' "$FILE"

          # Step 2: Use Python to precisely remove only the while(true){...} block
          # that follows the // SIGNATURE VERIFICATION BYPASSED marker.
          # This avoids the sed range-address bug that accidentally deleted
          # isKernelPatchUpdateBlocked() and isAndroidPatchUpdateBlocked() methods.
          python3 << 'PYEOF'
          import re

          with open("app/src/main/java/me/bmax/apatch/APatchApp.kt", "r") as f:
              lines = f.readlines()

          marker = "// SIGNATURE VERIFICATION BYPASSED - for custom build"
          result = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if marker in line:
                  result.append(line)
                  i += 1
                  # Collect whitespace-only lines
                  while i < len(lines) and lines[i].strip() == '':
                      result.append(lines[i])
                      i += 1
                  # Now skip the while(true){...} block that immediately follows
                  if i < len(lines) and re.match(r'\s*while\s*\(\s*true\s*\)\s*\{', lines[i]):
                      depth = 1
                      i += 1
                      while i < len(lines) and depth > 0:
                          for ch in lines[i]:
                              if ch == '{':
                                  depth += 1
                              elif ch == '}':
                                  depth -= 1
                          i += 1
                      # We've consumed the entire while(true){...} block including its closing }
                      # Now skip the if's closing brace '}' that remains
                      if i < len(lines) and lines[i].strip() == '}':
                          i += 1
                      # Also skip trailing whitespace-only lines
                      while i < len(lines) and lines[i].strip() == '':
                          i += 1
                  else:
                      # No while(true) block found right after marker; proceed normally
                      pass
              else:
                  result.append(line)
                  i += 1

          with open("app/src/main/java/me/bmax/apatch/APatchApp.kt", "w") as f:
              f.writelines(result)
          PYEOF

          echo "=== Verification: APatchApp.kt ==="
          grep -n "SIGNATURE\|verifyAppSignature\|while (true)" "$FILE" || echo "(signature check bypassed)"
          echo "=== Verification: LauncherIconUtils.kt ==="
          grep -n "desktop_app_name" app/src/main/java/me/bmax/apatch/util/LauncherIconUtils.kt

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > FolkPatch.jks

      - name: Create keystore.properties
        run: |
          cat > keystore.properties << 'EOF'
          KEYSTORE_FILE=../FolkPatch.jks
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - run: ./gradlew assembleRelease --no-daemon

      - name: Debug APK location
        run: find app/build/outputs -name "*.apk" -type f || echo "No APK found"

      - name: Rename APK
        run: |
          SHORT="${GITHUB_SHA::7}"
          APK=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          [ -n "$APK" ] && mv "$APK" "FolkPatch-Release-${SHORT}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: folkpatch-release-${{ github.sha }}
          path: FolkPatch-Release-*.apk
          retention-days: 30

  upload:
    name: Upload to Telegram
    needs: [prepare, build_debug, build_release]
    if: always() && needs.prepare.result == 'success' && (needs.build_debug.result == 'success' || needs.build_release.result == 'success') && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check Telegram config
        id: tg_check
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Telegram secrets not configured, skipping upload"
          fi

      - name: Download artifacts
        if: steps.tg_check.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: folkpatch-*
          path: artifacts
          merge-multiple: true

      - name: Send to Telegram
        if: steps.tg_check.outputs.enabled == 'true'
        run: |
          FILES=$(find artifacts -type f 2>/dev/null | sort)
          FILE_COUNT=$(echo "$FILES" | grep -c . || true)

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::No files found in artifacts"
            exit 1
          fi

          CAPTION="${{ needs.prepare.outputs.commit_msg }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nAuthor: ${{ needs.prepare.outputs.commit_author }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$FILE_COUNT" -eq 1 ]; then
            curl -sf -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
              -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -F "document=@$FILES" \
              -F "caption=${CAPTION}"
          else
            FILE_ARR=()
            while IFS= read -r f; do
              FILE_ARR+=("$f")
            done <<< "$FILES"

            TOTAL=${#FILE_ARR[@]}
            MEDIA_JSON="["
            for i in "${!FILE_ARR[@]}"; do
              FNAME=$(basename "${FILE_ARR[$i]}")
              if [ $i -gt 0 ]; then
                MEDIA_JSON+=","
              fi
              if [ $((i + 1)) -eq $TOTAL ]; then
                MEDIA_JSON+="{\"type\":\"document\",\"media\":\"attach://$FNAME\",\"caption\":\"${CAPTION}\"}"
              else
                MEDIA_JSON+="{\"type\":\"document\",\"media\":\"attach://$FNAME\"}"
              fi
            done
            MEDIA_JSON+="]"

            ARGS=(-X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMediaGroup")
            ARGS+=(-F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}")
            ARGS+=(-F "media=${MEDIA_JSON}")

            while IFS= read -r f; do
              FNAME=$(basename "$f")
              ARGS+=(-F "$FNAME=@$f")
            done <<< "$FILES"

            curl -sf "${ARGS[@]}"
          fi